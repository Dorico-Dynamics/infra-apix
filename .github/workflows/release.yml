name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Releases from main run one at a time, so each run tags after the previous
# run's tag exists. A newer push replaces a run that is still waiting, and its
# release covers both. A new push to a pull request cancels the older run.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < 80" | bc -l) )); then
            echo "Coverage is below 80% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build library
        run: go build ./...

      - name: Build CLI
        run: go build -o apix ./cmd/apix

      - name: Check release scripts
        run: |
          shellcheck .github/scripts/*.sh
          .github/scripts/next-version_test.sh

  sonarqube:
    needs: [test]
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  version:
    name: Determine Version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      version_changed: ${{ steps.semver.outputs.version_changed }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          # Pre-release (-rc.1) and build (+meta) tags are not release points.
          latest_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' --exclude '*+*')
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.latest_tag }}
        run: |
          # A random delimiter, so no commit message can end the value early.
          delimiter="CHANGELOG_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "changelog<<${delimiter}"
            git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s%n%b"
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Determine version bump
        id: semver
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.latest_tag }}
        run: |
          new_version=$(.github/scripts/next-version.sh "$LATEST_TAG")
          version_changed=false
          if [ -n "$new_version" ]; then
            version_changed=true
          fi
          echo "Since ${LATEST_TAG}: ${new_version:-no release}"
          {
            echo "new_version=${new_version}"
            echo "version_changed=${version_changed}"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create Release
    needs: [test, version]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Create Release Notes
        id: release_notes
        env:
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          VERSION: ${{ needs.version.outputs.new_version }}
          REPO: ${{ github.repository }}
        run: |
          cat > release_notes.md << 'NOTES_EOF'
          ## Changes

          NOTES_EOF
          echo "${CHANGELOG}" >> release_notes.md
          cat >> release_notes.md << NOTES_EOF

          ## Installation
          \`\`\`bash
          # Library
          go get github.com/Infra-Forge/infra-apix@${VERSION}

          # CLI Tool
          go install github.com/Infra-Forge/infra-apix/cmd/apix@${VERSION}
          \`\`\`

          ## Documentation
          - [pkg.go.dev](https://pkg.go.dev/github.com/Infra-Forge/infra-apix@${VERSION})
          - [Examples](https://github.com/${REPO}/tree/main/examples)
          - [README](https://github.com/${REPO}/blob/main/README.md)
          NOTES_EOF

      - name: Create Tag
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/${REPO}.git"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          release_name: apix ${{ needs.version.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  notify:
    name: Notify Release
    needs: [release, version]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Release Success Notification
        run: |
          echo "🎉 apix ${{ needs.version.outputs.new_version }} has been successfully released!"
          echo "📦 Go Module: github.com/Infra-Forge/infra-apix@${{ needs.version.outputs.new_version }}"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.new_version }}"
          echo "📚 Documentation: https://pkg.go.dev/github.com/Infra-Forge/infra-apix@${{ needs.version.outputs.new_version }}"

      - name: Create release summary
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          {
            echo "## 🚀 Release ${VERSION}"
            echo ""
            echo "### ✅ Quality Gates Passed"
            echo "- Tests passed with 80%+ coverage"
            echo "- Code quality verified"
            echo ""
            echo "### 📦 Installation"
            echo "\`\`\`bash"
            echo "# Library"
            echo "go get github.com/Infra-Forge/infra-apix@${VERSION}"
            echo ""
            echo "# CLI Tool"
            echo "go install github.com/Infra-Forge/infra-apix/cmd/apix@${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "### 🔗 Resources"
            echo "- [Release Notes](https://github.com/${REPO}/releases/tag/${VERSION})"
            echo "- [Documentation](https://pkg.go.dev/github.com/Infra-Forge/infra-apix@${VERSION})"
            echo "- [Examples](https://github.com/${REPO}/tree/main/examples)"
          } >> "$GITHUB_STEP_SUMMARY"
